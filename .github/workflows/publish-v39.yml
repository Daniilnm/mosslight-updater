name: Publish signed Mosslight v39
on:
  push:
    branches: ['release/publish-v39']
    paths: ['.github/workflows/publish-v39.yml']
permissions: {}
concurrency:
  group: mosslight-publish-v39
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Daniilnm/mosslight-updater' && github.ref == 'refs/heads/release/publish-v39'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch and verify exact public artifacts without credentials
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,os,pathlib,urllib.request,zipfile
          chunks = {'bundle-00.b64': '41ca7a3188dc56a5cddbfa49268ab727d1bb2843780aef4d2b8342e4c8d62276', 'bundle-01.b64': '282f5c48bcf7415c4305dc5bccea0d8ec751ad7239acb3c0ea0a28877c4ede2f', 'bundle-02.b64': 'e10c4b4bfe04b2513f0a6ae59c02031577783b61dce193baa04229d8a60ec997', 'bundle-03.b64': 'dd5605acf635a139ca2699c9fc21b053c77fcbd19720b62e6dc8c5941a7030c0', 'bundle-04.b64': 'ca95550922e8eed1683a4f024b32470950bf474b2daf5c732a03fd5f927e06e1', 'bundle-05.b64': '4265841f820dc3b234ad7755f2ebedecaccfe560dd721ebe32d35ac04dcf4000', 'bundle-06.b64': '5a6c119f48845923301e89485291722aee1546312a4b0b467600cf8ca330abaf', 'bundle-07.b64': '9cf531719f71e309e56a33056fe5e81d699a9f0ef220fa2a22a1aa28e6b6f7a9', 'bundle-08.b64': 'a621c537a755ddaa5194dc258bb91fbb7c6a98d1cdc4d771560df872064f1d43', 'bundle-09.b64': 'd12773e5b0d8b875a06168ac1cbbba9ee83afdb818a6d810d55b0a81cd16c64c', 'bundle-10.b64': '83c5c8edc957fda13f4cfa80911cc73f223c16081cf240e01ca6e22fd213e2d3'}
          expected = {'blob-1099e4a5770db98154571702b568e955caa87c50fadf7c22b9636a18b9d95195.gz': '0f5dc05839526d29352a2a2955ba8196680a48587e245c3357d701a31ddb508c', 'blob-18d1d6c2a874670e85621d379f81a9b6da8c040a2ae2e9a25883290f622653d5.gz': '292c206cb57edfbe1ccb515e700db09c5f5d681c5d6cd8ec1076f3902b397701', 'blob-191fe0397af154a8d85da0afd52751bba1381fa1937fbec6ccdbe5da8ab0ba42.gz': '40b52815bd229b346433369a0b2d79e46d230525f512b0c87dde5405de90bd9e', 'blob-399afffc2d9b73f4bd823358e98aa99406d64faad479452711ca4dd18da5caf5.gz': 'd9b16319dc8bfd6fec97f0a6c44c532d8f51af98129870f9a71707bd6597399a', 'blob-46f13dd3fc54069b5cd32737acea65f095d1e331fb9daa988028eca408ff3853.gz': '3e137a7e7204e385da281d161fdc3ad9a5f7da3aba2afeb3ee79b6e29e3ee166', 'blob-480c72c2d01009b88eec663d9d206e43cb1bfa9b5f290efeec302ee67b9984b7.gz': '8759f610ea2abe75d2480a2b4ddf77f00fa214dd4869a29cea79c3bc90dd2060', 'blob-619a218f5454a2c1c9f97acc0a1e29ebf5ab49803f4c403e92aed6d969a70225.gz': '94d137ce680ca1ea7667fd9a1596bda39c915a7af8efe5896da1729c1debf05e', 'blob-68ae9256d9bcc83b4149e0e0c52a3e8649ce8c9b4cd0fdb5cf06299307e91434.gz': '0f1623e955a0fde0d71ad688a933d1130fe79eea9b77de6409279040d46182a2', 'blob-6f02bcd26f8758d4f4e87555721f5e1ec8091a012f4837f308331a78985fe450.gz': '2cf097a40fc19b80ef0ee121709f275b7097ae5abf026a647fbe494f802c2d16', 'blob-7d090ccb469b095eba0f08d37d426ded22aa6ad730001bf19f8c755b1a84f229.gz': '0c637de111a5b4ccd567796004fa212865aa5411ed3d4769423f36f43f44a614', 'blob-8a375b60fa86502ef785b3cba0e559b260b3af617460c111daccaeb528f1da5b.gz': 'e9fcdcc366b1d9540ffab9409ee7859a1c96a66474a3aa9db32368f97fa9dea5', 'blob-8dfdc778e639020cf3f801b0a05c10ba8269055162847f207a5740e9b4aeb120.gz': 'e06b292ca76378ac58b709febc3eb2e8d58264e0580c4348e797709d8e59b640', 'blob-969d163d486168ef181a95146e3fbfef6a42128f05b5cd2f953ac4b03226c022.gz': '9fa8d32e64a6d9af78f8e1d071ec2f280b020b186bfbd95538f2159090309e9c', 'blob-a0d9a9bff64819c2f04c1caf59f29d930f90f80f7e60490f3c0397e1d4eb50a8.gz': '8061f83c8b063bf4f572193c2e7c8